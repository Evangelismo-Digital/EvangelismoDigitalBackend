services:
  db:
    image: postgis/postgis:16-3.4
    container_name: db_evangelismo_dev
    # Preload pg_stat_statements so `CREATE EXTENSION pg_stat_statements` (migration)
    # succeeds and postgres-exporter can collect query statistics.
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
    ports:
      - "5432:5432"
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - evangelismo-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: redis_evangelismo_dev
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD} --save "" --appendonly no
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - evangelismo-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
  redis_data:

networks:
  evangelismo-network:
    driver: bridge
    name: evangelismo-network