# SonarQube analysis configuration.
#
# Run through scripts/sonar.sh (npm run sonar) — it starts the server, produces
# the coverage / test-execution / ESLint reports referenced below, runs the
# scanner and then fails the build on the quality gate. Running the scanner by
# hand without those reports silently analyses the project with zero coverage.

sonar.projectKey=evangelismo-digital-backend
sonar.projectName=Evangelismo Digital Backend
sonar.projectVersion=1.0.0
sonar.sourceEncoding=UTF-8

# ─── What is analysed ────────────────────────────────────────────────────────
# `sources` and `tests` both point at src/; the two inclusion lists below
# partition it. Sonar applies different rule sets to each — production rules
# (complexity, security) to sources, test-specific rules (no focused/skipped
# test, assertion presence) to tests — so mislabelling a file loses real checks.
sonar.sources=src
sonar.tests=src

# `*.contract.ts` is deliberately absent: those files declare shared scenarios
# but contain no test case of their own, so classifying them as tests makes
# S2187 ("add some tests to this file or delete it") fire on a helper. They are
# already excluded from sources below, so they are simply not analysed.
sonar.test.inclusions=**/*.spec.ts,**/*.spec.mts

# Generated Prisma client, k6 load scripts (a different runtime with its own
# globals) and the compiled bundle are not hand-written source.
sonar.exclusions=\
  **/*.spec.ts,\
  **/*.spec.mts,\
  **/*.contract.ts,\
  src/generated/**,\
  src/load-test/**,\
  dist/**,\
  coverage/**,\
  reports/**,\
  .ci-local/**,\
  .stryker-tmp/**

# Bootstrap files that exist to wire the process together: they are exercised
# by the Docker smoke test rather than by unit tests, and demanding line
# coverage of them would push work toward testing the framework.
sonar.coverage.exclusions=\
  src/server.ts,\
  src/worker.ts,\
  src/metrics-server.ts,\
  src/env/index.ts,\
  src/**/factories/**,\
  src/templates/**,\
  src/messages/**,\
  prisma/**

# Duplication detection on the message/template catalogues is noise: they are
# deliberately parallel string tables, and de-duplicating them would couple
# unrelated copy.
sonar.cpd.exclusions=src/messages/**,src/templates/**,src/http/schemas/**

# ─── Language settings ───────────────────────────────────────────────────────
sonar.typescript.tsconfigPaths=tsconfig.json

# ─── Imported third-party reports ────────────────────────────────────────────
# Coverage (Layer 2/3) and test execution (Layer 1/2) come from Vitest; the
# ESLint report carries the rules Sonar has no equivalent for (security plugin,
# node deprecations, dead imports) into the same dashboard.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.testExecutionReportPaths=reports/sonar/test-execution.xml
sonar.eslint.reportPaths=reports/eslint/eslint-report.json

# ─── SCM ─────────────────────────────────────────────────────────────────────
# Blame data is what makes the "new code" conditions of the quality gate mean
# anything; without it every line looks new on every scan.
sonar.scm.provider=git

# ─── Scoped rule exemptions ──────────────────────────────────────────────────
# Narrow, per-path silences. Each one is a place where a rule measures the
# wrong thing, and each is scoped to the smallest path that fixes it — a rule
# switched off globally would stop protecting the rest of the tree.
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6,e7,e8,e9,e10

# S109 (magic numbers) in the environment schema. Every literal there IS the
# definition of a default — `.default(9091)` for the metrics port, `.default(12)`
# for bcrypt rounds. Naming them would only add a constant that says the same
# word twice, and the Zod schema is already the single place they live.
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S109
sonar.issue.ignore.multicriteria.e1.resourceKey=src/env/index.ts

# S109 in the Prometheus metric definitions: the numbers are histogram bucket
# boundaries (`buckets: [5, 30, 120, ...]`), a measurement scale rather than a
# magic value. Naming each boundary hides the shape of the scale.
sonar.issue.ignore.multicriteria.e2.ruleKey=typescript:S109
sonar.issue.ignore.multicriteria.e2.resourceKey=src/lib/metrics/**/*.ts

# S2187 ("add some tests to this file or delete it") on the three suites whose
# cases are declared by an imported helper — the repository contract runner and
# vitest-cucumber's describeFeature. The tests exist and run (they are counted
# in the imported execution report); Sonar's parser just cannot see a `describe`
# that another module registers.
sonar.issue.ignore.multicriteria.e3.ruleKey=typescript:S2187
sonar.issue.ignore.multicriteria.e3.resourceKey=**/*.contract.spec.ts
sonar.issue.ignore.multicriteria.e4.ruleKey=typescript:S2187
sonar.issue.ignore.multicriteria.e4.resourceKey=**/*.integration.spec.ts
sonar.issue.ignore.multicriteria.e5.ruleKey=typescript:S2187
sonar.issue.ignore.multicriteria.e5.resourceKey=**/*.acceptance.spec.mts

# S138 (function too long) on the e-mail templates. Their bodies are a single
# HTML string literal with no branching, so the rule measures markup rather
# than logic — the same reason eslint.config.mjs turns off
# `max-lines-per-function` for this directory. `complexity` and nesting depth
# still apply here.
sonar.issue.ignore.multicriteria.e6.ruleKey=typescript:S138
sonar.issue.ignore.multicriteria.e6.resourceKey=src/templates/**/*.ts

# S6564 (redundant type alias) on `LockToken = string`. The alias names a
# domain concept that appears in nine signatures across the distributed lock —
# `renew(key: string, token: LockToken)` says which string is which, and
# spelling both as `string` is the outcome the rule would produce.
sonar.issue.ignore.multicriteria.e7.ruleKey=typescript:S6564
sonar.issue.ignore.multicriteria.e7.resourceKey=src/lib/infra/distributed-lock/distributed-lock.ts

# S3801 (inconsistent returns) on Fastify hooks and plugins. `return reply` is
# Fastify's documented way for an async hook to stop the request lifecycle, and
# falling through without returning is how it continues. The "inconsistency" IS
# the framework contract; making the returns uniform would change routing
# behaviour to satisfy a style.
sonar.issue.ignore.multicriteria.e8.ruleKey=typescript:S3801
sonar.issue.ignore.multicriteria.e8.resourceKey=src/http/**/*.ts

# S100 (function naming) inside the error registry. Its keys are the CLASS
# NAMES of the errors they rebuild — `InvalidCepError: (msg) => new
# InvalidCepError(...)` — because `serializeAppError` writes
# `err.constructor.name` and the registry is looked up by exactly that string.
# Renaming them to camelCase would break the round trip the registry exists for.
# The rule stays on everywhere else, including the widened UPPER_SNAKE form that
# the Prisma error-code tables need.
sonar.issue.ignore.multicriteria.e9.ruleKey=typescript:S100
sonar.issue.ignore.multicriteria.e9.resourceKey=src/errors/app-error-registry.ts

# S3003 (comparison operators on strings) in the deterministic comparator. The
# module exists precisely to compare two strings by UTF-16 code unit, and the
# rule's suggested alternative — localeCompare — is the bug it was written to
# avoid (see the docblock in stable-order.ts).
sonar.issue.ignore.multicriteria.e10.ruleKey=typescript:S3003
sonar.issue.ignore.multicriteria.e10.resourceKey=src/core/shared/stable-order.ts
