# OSV-Scanner ignore config — Evangelismo Digital Backend
#
# Revisit periodically (aim: within ~90 days) rather than treating these as
# permanent. Each entry carries its own reasoning, its own re-check command and
# an `ignoreUntil`: when that date passes, OSV-Scanner stops honouring the entry
# and CI goes red, which is what forces the revisit instead of hoping for it.
#
# The first entry below exists only because of the 7-day release
# quarantine in .npmrc (min-release-age=7): the fix is published but still too
# new to install. Its `ignoreUntil` is the day after the fix becomes
# installable — on that day, bump and delete the entry.
#
# Cleared on 2026-11-02 (do not re-add without re-checking):
# - GHSA-mrwp-f3q8-3g9p / SNYK-JS-FOLLOWREDIRECTS-21762031 (follow-redirects via
#   axios): override bumped to 1.16.2 once past the 7-day quarantine.
#
# Cleared on 2026-10-31 (do not re-add without re-checking):
# - GHSA-c2qf-rxjj-qqgw (semver, bundled in snyk): snyk 1.1308.3 no longer ships
#   the 7.3.8 copy — `npm ls semver@7.3.8` is empty.
# - GHSA-6w3j-5fw6-r9vr (@hapi/joi via cpf-cnpj-validator 1.0.3): the validator
#   moved to 2.1.2, which has no runtime dependencies; @hapi/joi is gone.
# - GHSA-hp3w-g68c-fv3c (sprintf-js, bundled in snyk): the advisory was
#   WITHDRAWN upstream on 2026-10-22 (`curl api.osv.dev/v1/vulns/GHSA-hp3w-g68c-fv3c`).
#
# OSV prints "has unused ignores" for entries that are in fact working, so
# cross-check against a run with an empty config before deleting on that
# message alone.

[[IgnoredVulns]]
id = "GHSA-3g3m-2fjr-6pw4"
ignoreUntil = 2026-11-04T00:00:00Z
reason = """
glob 10.5.0 (tsup > sucrase) and 13.0.6 (dpdm): an AbortSignal that fires after
a timeout does not stop the filesystem walk. Dev-only — neither package is in
the production image (Dockerfile installs with --omit=dev) — and neither caller
passes an AbortSignal: sucrase globs its CLI inputs, dpdm resolves our own
src/ tree.

QUARANTINE. The only fix is glob 14.0.2, published 2026-10-27T22:07Z, installable
from 2026-11-03T22:07Z. It is a MAJOR bump for both consumers (10.x and 13.x), so
on that date try a top-level `"glob": "14.0.2"` override and run `npm run build`
(tsup) and `npm run check:cycles` (dpdm). If both pass, keep it and delete this
entry; if not, re-baseline with the failure recorded here. Re-check with
`npm ls glob`.
"""

[[IgnoredVulns]]
id = "GHSA-g3hv-75wg-m249"
ignoreUntil = 2027-01-31T00:00:00Z
reason = """
minimatch < 11.0.1: pattern-expansion ("globparts") amplification lets a hostile
GLOB PATTERN consume CPU. Present as 3.1.5 (eslint, @eslint/*, eslint-plugin-import,
npm-run-all), 9.0.9 (sucrase's glob) and 10.2.6 (stryker, eslint-plugin-sonarjs,
ts-morph, dpdm's glob).

NO FIX EXISTS on any of those lines: the advisory is fixed only in 11.0.1, and
11.x changed the module's export shape, so overriding it under eslint 9 (which
calls the 3.x default export) breaks linting. Accepted because every copy is a
devDependency outside the production image, and the patterns they evaluate come
from our own config files (eslint.config.mjs, stryker.conf.mjs, tsconfig) — never
from a request or any other untrusted input.

Revisit by 2027-01-31, or sooner when eslint 10 / the plugins move to minimatch
11 or the 3.x/9.x/10.x lines get a backport. Re-check with `npm ls minimatch`.
"""
