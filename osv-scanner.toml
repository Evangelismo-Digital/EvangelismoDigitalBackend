# OSV-Scanner ignore config — Evangelismo Digital Backend
#
# Every entry below has a real upstream fix, but not one safe to take right
# now. Revisit periodically (aim: within ~90 days) rather than treating these
# as permanent.
#
# (The two @hono/node-server entries that used to live here were dropped once
# prisma 7.9.1 removed that transitive dependency entirely.)

[[IgnoredVulns]]
id = "GHSA-mh99-v99m-4gvg"
reason = "brace-expansion DoS (unbounded expansion -> OOM). Dev-only: reached via eslint-plugin-import (minimatch 3.x), typescript-eslint and tsup/sucrase (minimatch 9.x); never in the production Docker image, and the glob patterns fed to it are our own config, not attacker input. The advisory's only fixed version is 5.0.8, and brace-expansion 5.x changed its entry point to a named `expand` export while minimatch 3.x/9.x still import it as a callable default — an override would break lint and build. Reachable only when the tooling itself moves to minimatch 10.x."

