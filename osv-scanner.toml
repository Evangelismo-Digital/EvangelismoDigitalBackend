# OSV-Scanner ignore config — Evangelismo Digital Backend
#
# Every entry below has a real upstream fix, but not one safe to take right
# now. Revisit periodically (aim: within ~90 days) rather than treating these
# as permanent.
#
# (The two @hono/node-server entries that used to live here were dropped once
# prisma 7.9.1 removed that transitive dependency entirely.)

[[IgnoredVulns]]
id = "GHSA-c2qf-rxjj-qqgw"
reason = """
ReDoS in semver <7.5.2, reached only through snyk's BUNDLED copy at
node_modules/snyk/node_modules/global-agent/node_modules/semver (the lockfile
entry carries inBundle: true). npm `overrides` cannot rewrite a bundled
dependency — verified: a top-level override, a nested one, and deleting the lock
entry all re-resolve to 7.3.8, because the version ships inside snyk's own
tarball. Only Snyk can fix it upstream.

Accepted because the exposure is nil in practice: snyk is a devDependency, is
never installed into the production image (the Dockerfile installs with --omit=dev
and the runner stage copies only @prisma/client), and the vulnerable code path is
semver range parsing on input that only ever comes from our own package.json.

Revisit when snyk publishes a build with global-agent updated; check with
`npm ls semver` after a snyk bump.
"""

[[IgnoredVulns]]
id = "GHSA-6w3j-5fw6-r9vr"
reason = """Prototype pollution in @hapi/joi via a `__proto__` language key in
CUSTOM MESSAGES. Reached only through cpf-cnpj-validator@1.0.3 -> @hapi/joi@17.1.1,
which this project calls in exactly one place: src/http/schemas/utils/cpf.ts, as
`cpf.isValid` and `cpf.format` on a value Zod has already narrowed to 11 digits
(`.length(CPF_DIGITS)` runs before the `.refine`). No custom message object is
passed to Joi anywhere in the codebase, so the polluting sink is never fed — the
library is used purely as a checksum validator over a digit string.

No fixed version exists: @hapi/joi is end-of-life, and the advisory's remedy is
cpf-cnpj-validator@2.1.2, a semver-MAJOR bump to CPF validation used across
registration, authentication, password reset and update.

Revisit if cpf-cnpj-validator ships a 1.x patch that moves off @hapi/joi, or when
the major upgrade is scheduled on its own. Re-check with `npm ls @hapi/joi`."""

[[IgnoredVulns]]
id = "GHSA-hp3w-g68c-fv3c"
reason = """
DoS in sprintf-js (CVE-2026-97058): unvalidated precision specifiers reach
toFixed/toExponential/toPrecision and can throw an uncaught RangeError when the
attacker controls the FORMAT STRING.

No fixed version exists. The advisory's affected range is `<= 1.1.3`, and 1.1.3
is the newest version ever published — OSV-Scanner itself reports "0
vulnerabilities can be fixed". Upgrading is not an option that exists.

Neither is overriding. The vulnerable copy arrives as
node_modules/snyk/node_modules/roarr/node_modules/sprintf-js, and snyk declares
`bundleDependencies: ["global-agent", "roarr", "boolean"]` — 23 lockfile entries
under snyk carry inBundle: true. Verified: a top-level `roarr` override, a
nested `snyk > roarr` override, a `snyk > global-agent` override (4.1.3 drops
roarr entirely) and a full lockfile re-resolution all leave roarr at 2.15.4,
because it ships inside snyk's own tarball. This is the same mechanism already
documented for GHSA-c2qf-rxjj-qqgw above.

Accepted because the exposure is nil in practice: snyk is a devDependency, never
installed into the production image (the Dockerfile installs with --omit=dev and
the runner stage copies only dist plus @prisma/client/.prisma), and the sink is
roarr's log formatting inside the snyk CLI, whose format strings are snyk's own
literals — never our input, let alone a request's.

Revisit when snyk publishes a build whose bundled global-agent is 4.x (which has
no roarr dependency at all); check with `npm ls sprintf-js` after a snyk bump.
The same bump should also clear GHSA-c2qf-rxjj-qqgw.
"""
