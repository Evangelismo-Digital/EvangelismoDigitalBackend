# OSV-Scanner ignore config — Evangelismo Digital Backend
#
# Every entry below has a real upstream fix, but not one safe to take right
# now. Revisit periodically (aim: within ~90 days) rather than treating these
# as permanent.
#
# (The two @hono/node-server entries that used to live here were dropped once
# prisma 7.9.1 removed that transitive dependency entirely.)

[[IgnoredVulns]]
id = "GHSA-c2qf-rxjj-qqgw"
reason = """
ReDoS in semver <7.5.2, reached only through snyk's BUNDLED copy at
node_modules/snyk/node_modules/global-agent/node_modules/semver (the lockfile
entry carries inBundle: true). npm `overrides` cannot rewrite a bundled
dependency — verified: a top-level override, a nested one, and deleting the lock
entry all re-resolve to 7.3.8, because the version ships inside snyk's own
tarball. Only Snyk can fix it upstream.

Accepted because the exposure is nil in practice: snyk is a devDependency, is
never installed into the production image (the Dockerfile installs with --omit=dev
and the runner stage copies only @prisma/client), and the vulnerable code path is
semver range parsing on input that only ever comes from our own package.json.

Revisit when snyk publishes a build with global-agent updated; check with
`npm ls semver` after a snyk bump.
"""
